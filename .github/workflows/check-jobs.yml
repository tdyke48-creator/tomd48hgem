name: Check Mystery Dining Jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run job checker
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_jobs.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f seen_jobs.json ] && git add seen_jobs.json
          [ -f auth_status.json ] && git add auth_status.json
          git diff --quiet --cached || git commit -m "Update seen jobs state"
          git push
